name: Deploy via Patchouli

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  trigger-patchouli:
    runs-on: codeberg-tiny
    container:
      image: alpine:3.22
    steps:
      - name: Trigger deployment webhook
        env:
          PATCHOULI_WEBHOOK_URL: "https://cd.zenisoft.net.ua/patchouli"
          PATCHOULI_TOKEN: ${{ secrets.PATCHOULI_TOKEN }}
        run: |
          set -eu
          test -n "$PATCHOULI_WEBHOOK_URL"
          test -n "$PATCHOULI_TOKEN"
          apk add --no-cache curl
          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $PATCHOULI_TOKEN" \
            "$PATCHOULI_WEBHOOK_URL"
